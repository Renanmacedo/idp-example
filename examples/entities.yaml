# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: examples
spec:
  owner: guests
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-api
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: example-grpc-api
spec:
  type: grpc
  lifecycle: experimental
  owner: guests
  system: examples
  definition: |
    syntax = "proto3";

    service Exampler {
      rpc Example (ExampleMessage) returns (ExampleMessage) {};
    }

    message ExampleMessage {
      string example = 1;
    };
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example
  repositoryId: example-repo
  siblings: [example-frontend, example-api, example-worker]
spec:
  type: kubernetes
  lifecycle: experimental
  owner: guests
  system: examples
  providesApis: [example-grpc-api]
---

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-worker
  repositoryId: example-repo
  siblings: [example,example-frontend, example-api]
spec:
  type: glue
  lifecycle: experimental
  owner: guests
  system: examples
---

apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-frontend
  repositoryId: example-repo
  siblings: [example, example-api, example-worker]
spec:
  type: frontend
  lifecycle: experimental
  owner: guests
  system: examples
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-api
  repositoryId: example-repo
  siblings: [example, example-frontend, example-worker]
spec:
  type: api-gateway
  lifecycle: experimental
  owner: guests
  system: examples
  consumesApis: [example-grpc-api]
